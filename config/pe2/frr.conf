frr version 8.4
frr defaults traditional
hostname pe2
service integrated-vtysh-config
!
mpls label dynamic-block 220000 229999
!
interface lo
 ip address 2.2.2.2/32
 ip ospf area 0
!
interface eth1
 ip address 10.100.1.46/30
 ip ospf area 0
!
interface eth2
 ip address 10.100.1.50/30
 ip ospf area 0
!
interface eth3
 ip address 10.100.1.54/30
 ip ospf area 0
!
interface eth4
 description Connection to ce-dc
!
interface eth4.10
 vrf Launch_Ops
 ip address 172.16.10.6/30
!
interface eth4.20
 vrf Sat_Ops
 ip address 172.16.20.6/30
!
interface eth4.30
 vrf Tracking
 ip address 172.16.30.6/30
!
interface eth4.40
 vrf Admin
 ip address 172.16.40.6/30
!
!
router ospf
 ospf router-id 2.2.2.2
!
mpls ldp
 router-id 2.2.2.2
 !
 address-family ipv4
  discovery transport-address 2.2.2.2
  !
  interface eth1
  interface eth2
  interface eth3
  !
 exit-address-family
!
router bgp 65001
 bgp router-id 2.2.2.2
 no bgp default ipv4-unicast
 neighbor PE_PEERS peer-group
 neighbor PE_PEERS remote-as 65001
 neighbor PE_PEERS update-source lo
 neighbor 2.2.2.1 peer-group PE_PEERS
 neighbor 2.2.2.3 peer-group PE_PEERS
 neighbor 2.2.2.4 peer-group PE_PEERS
 neighbor 2.2.2.5 peer-group PE_PEERS
 neighbor 2.2.2.6 peer-group PE_PEERS
 !
 address-family vpnv4 unicast
  neighbor PE_PEERS activate
 exit-address-family
!
router bgp 65001 vrf Launch_Ops
 rd 65001:10
 route-target import 65001:10
 route-target export 65001:10
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
!
router bgp 65001 vrf Sat_Ops
 rd 65001:20
 route-target import 65001:20
 route-target export 65001:20
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
!
router bgp 65001 vrf Tracking
 rd 65001:30
 route-target import 65001:30
 route-target export 65001:30
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
!
router bgp 65001 vrf Admin
 rd 65001:40
 route-target import 65001:40
 route-target export 65001:40
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
!
ip route 3.3.3.1/32 172.16.10.5 vrf Launch_Ops
ip route 3.3.3.1/32 172.16.20.5 vrf Sat_Ops
ip route 3.3.3.1/32 172.16.30.5 vrf Tracking
ip route 3.3.3.1/32 172.16.40.5 vrf Admin
!
line vty
!
