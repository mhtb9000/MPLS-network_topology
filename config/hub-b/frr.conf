frr version 8.4
frr defaults traditional
hostname hub-b
service integrated-vtysh-config
!
interface lo
 ip address 3.3.3.3/32
!
interface eth1
 description Connection to PE pe4
!
interface eth1.10
 vrf Launch_Ops
 ip address 172.16.10.13/30
!
interface eth1.20
 vrf Sat_Ops
 ip address 172.16.20.13/30
!
interface eth1.30
 vrf Tracking
 ip address 172.16.30.13/30
!
interface eth1.40
 vrf Admin
 ip address 172.16.40.13/30
!
interface eth2
 vrf Launch_Ops
 ip address 192.168.5.254/24
!
interface eth3
 vrf Sat_Ops
 ip address 192.168.6.254/24
!
interface eth4
 vrf Tracking
 ip address 192.168.7.254/24
!
interface eth5
 vrf Admin
 ip address 192.168.8.254/24
!
!
ip route 0.0.0.0/0 172.16.10.14 vrf Launch_Ops
ip route 0.0.0.0/0 172.16.20.14 vrf Sat_Ops
ip route 0.0.0.0/0 172.16.30.14 vrf Tracking
ip route 0.0.0.0/0 172.16.40.14 vrf Admin
!
line vty
!
