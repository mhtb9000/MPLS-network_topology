frr version 8.4
frr defaults traditional
hostname pe5
service integrated-vtysh-config
!
mpls label dynamic-block 250000 259999
!
interface lo
 ip address 2.2.2.5/32
!
interface eth1
 ip address 10.100.1.65/30
 ip ospf area 0
!
interface eth2
 description Connection to hub-c
!
interface eth2.10
 vrf Launch_Ops
 ip address 172.16.10.18/30
!
interface eth2.20
 vrf Sat_Ops
 ip address 172.16.20.18/30
!
interface eth2.30
 vrf Tracking
 ip address 172.16.30.18/30
!
interface eth2.40
 vrf Admin
 ip address 172.16.40.18/30
!
!
router ospf
 ospf router-id 2.2.2.5
 network 2.2.2.5/32 area 0
 network 10.100.1.0/24 area 0
!
mpls ldp
 router-id 2.2.2.5
 !
 address-family ipv4
  discovery transport-address 2.2.2.5
  !
  interface eth1
  !
 exit-address-family
!
router bgp 65001
 bgp router-id 2.2.2.5
 no bgp default ipv4-unicast
 neighbor PE_PEERS peer-group
 neighbor PE_PEERS remote-as 65001
 neighbor PE_PEERS update-source lo
 neighbor 2.2.2.1 peer-group PE_PEERS
 neighbor 2.2.2.2 peer-group PE_PEERS
 neighbor 2.2.2.3 peer-group PE_PEERS
 neighbor 2.2.2.4 peer-group PE_PEERS
 neighbor 2.2.2.6 peer-group PE_PEERS
 !
 address-family vpnv4 unicast
  neighbor PE_PEERS activate
 exit-address-family
!
router bgp 65001 vrf Launch_Ops
 rd 65001:10
 route-target import 65001:10
 route-target export 65001:10
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
!
router bgp 65001 vrf Sat_Ops
 rd 65001:20
 route-target import 65001:20
 route-target export 65001:20
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
!
router bgp 65001 vrf Tracking
 rd 65001:30
 route-target import 65001:30
 route-target export 65001:30
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
!
router bgp 65001 vrf Admin
 rd 65001:40
 route-target import 65001:40
 route-target export 65001:40
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
!
ip route 192.168.9.0/24 172.16.10.17 vrf Launch_Ops
ip route 192.168.10.0/24 172.16.20.17 vrf Sat_Ops
ip route 192.168.11.0/24 172.16.30.17 vrf Tracking
ip route 192.168.12.0/24 172.16.40.17 vrf Admin
!
line vty
!
