frr version 8.4
frr defaults traditional
hostname p3
service integrated-vtysh-config
!
mpls label dynamic-block 130000 139999
!
interface lo
 ip address 1.1.1.3/32
!
interface eth1
 ip address 10.100.1.22/30
 ip ospf area 0
!
interface eth2
 ip address 10.100.1.25/30
 ip ospf area 0
!
interface eth3
 ip address 10.100.1.53/30
 ip ospf area 0
!
interface eth4
 ip address 10.100.1.70/30
 ip ospf area 0
!
!
router ospf
 ospf router-id 1.1.1.3
 network 1.1.1.3/32 area 0
 network 10.100.1.0/24 area 0
!
mpls ldp
 router-id 1.1.1.3
 !
 address-family ipv4
  discovery transport-address 1.1.1.3
  !
  interface eth1
  interface eth2
  interface eth3
  interface eth4
  !
 exit-address-family
!
line vty
!
