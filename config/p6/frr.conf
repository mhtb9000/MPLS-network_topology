frr version 8.4
frr defaults traditional
hostname p6
service integrated-vtysh-config
!
mpls label dynamic-block 160000 169999
!
interface lo
 ip address 1.1.1.6/32
 ip ospf area 0
!
interface eth1
 ip address 10.100.1.10/30
 ip ospf area 0
!
interface eth2
 ip address 10.100.1.38/30
 ip ospf area 0
!
interface eth3
 ip address 10.100.1.18/30
 ip ospf area 0
!
interface eth4
 ip address 10.100.1.30/30
 ip ospf area 0
!
!
router ospf
 ospf router-id 1.1.1.6
!
mpls ldp
 router-id 1.1.1.6
 !
 address-family ipv4
  discovery transport-address 1.1.1.6
  !
  interface eth1
  interface eth2
  interface eth3
  interface eth4
  !
 exit-address-family
!
line vty
!
