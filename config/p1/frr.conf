frr version 8.4
frr defaults traditional
hostname p1
service integrated-vtysh-config
!
mpls label dynamic-block 110000 119999
!
interface lo
 ip address 1.1.1.1/32
 ip ospf area 0
!
interface eth1
 ip address 10.100.1.2/30
 ip ospf area 0
!
interface eth2
 ip address 10.100.1.5/30
 ip ospf area 0
!
interface eth3
 ip address 10.100.1.9/30
 ip ospf area 0
!
interface eth4
 ip address 10.100.1.13/30
 ip ospf area 0
!
!
router ospf
 ospf router-id 1.1.1.1
!
mpls ldp
 router-id 1.1.1.1
 !
 address-family ipv4
  discovery transport-address 1.1.1.1
  !
  interface eth1
  interface eth2
  interface eth3
  interface eth4
  !
 exit-address-family
!
line vty
!
