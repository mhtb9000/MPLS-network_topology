frr version 8.4
frr defaults traditional
hostname ce-dc
service integrated-vtysh-config
!
interface lo
 ip address 3.3.3.1/32
!
interface eth1
 description Connection to PE pe1
!
interface eth1.10
 vrf Launch_Ops
 ip address 172.16.10.1/30
!
interface eth1.20
 vrf Sat_Ops
 ip address 172.16.20.1/30
!
interface eth1.30
 vrf Tracking
 ip address 172.16.30.1/30
!
interface eth1.40
 vrf Admin
 ip address 172.16.40.1/30
!
interface eth2
 description Connection to PE pe2
!
interface eth2.10
 vrf Launch_Ops
 ip address 172.16.10.5/30
!
interface eth2.20
 vrf Sat_Ops
 ip address 172.16.20.5/30
!
interface eth2.30
 vrf Tracking
 ip address 172.16.30.5/30
!
interface eth2.40
 vrf Admin
 ip address 172.16.40.5/30
!
!
ip route 0.0.0.0/0 172.16.10.2 vrf Launch_Ops
ip route 0.0.0.0/0 172.16.20.2 vrf Sat_Ops
ip route 0.0.0.0/0 172.16.30.2 vrf Tracking
ip route 0.0.0.0/0 172.16.40.2 vrf Admin
ip route 0.0.0.0/0 172.16.10.6 vrf Launch_Ops
ip route 0.0.0.0/0 172.16.20.6 vrf Sat_Ops
ip route 0.0.0.0/0 172.16.30.6 vrf Tracking
ip route 0.0.0.0/0 172.16.40.6 vrf Admin
!
line vty
!
